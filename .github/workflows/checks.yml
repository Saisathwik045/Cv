name: Lightweight checks
on:
  pull_request:
  push:
    branches: [main, 'phase/**']
permissions:
  contents: read
jobs:
  phase2-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/phase2-cpu.lock
      - run: python -m pip install -r requirements/phase2-cpu.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests

  foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[data]"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: trustretina check-config --config configs/phase0.toml
      - run: trustretina plan --config configs/phase0.toml
      - run: trustretina check-config --config configs/phase1.toml
      - run: trustretina check-env

  duplicate-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[data,duplicate-review]"
      - run: python -m unittest discover -s tests -p 'test_photo_verification.py' -v
