[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustretina"
version = "0.1.0"
description = "Reproducible patient-separated retinal screening research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["numpy>=1.26,<3", "pandas>=2.1,<3", "openpyxl>=3.1,<4", "Pillow>=10.3,<13", "scikit-learn>=1.4,<2"]
train = ["torch==2.7.1", "torchvision==0.22.1"]
reports = ["matplotlib>=3.8,<4"]
app = ["streamlit>=1.38,<2"]
runner = ["kaggle>=2.2.5,<3"]
duplicate-review = ["opencv-python-headless==4.11.0.86", "scikit-image==0.25.2"]

[project.scripts]
trustretina = "trustretina.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
